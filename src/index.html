<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Happy Birthday!</title>
</head>
<body>
    <div class="container">
        <div class="main-screen">
            <img src="/assets/imgs/background.png" class="bg-image">
        </div>
        <div class="childhood-image-container">
            <img src="/assets/imgs/childhood-edited.png">
        </div>
        <div class="adolescence-image-container">
            <img src="/assets/imgs/adolescence-edited.png">
        </div>
        <div class="adulthood-image-container">
            <img src="/assets/imgs/adulthood-edited.png">
        </div>
        <div class="etyourth-image-container">
            <img src="/assets/imgs/eternal-yourth-edited.png">
        </div>
        <div class="presents">
            <div class="green-present">
                <img src="/assets/green-present.png">
            </div>
            <div class="orange-present">
                <img src="/assets/imgs/orange-present.png">
            </div>
            <div class="violet-present">
                <img src="/assets/imgs/violet-present.png">
            </div>
            <div class="red-present">
                <img src="/assets/imgs/red-present.png">
            </div>
            <div class="multicolor-present">
                <img src="/assets/imgs/multicolor-present.png">
            </div>
        </div>

        <div class="story-container">
            <div class="story-image"></div>
            <div class="story-text" style="display: none;"></div>
            <button class="next-button">=></button>
        </div>
        <div class="overlay"></div>


        <script src="/src/script.js"></script>
</body>
</html>
